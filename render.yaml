services:
  - type: web
    name: emergencycore-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements-models.txt -r requirements-geo.txt && python scripts/setup_model.py
    startCommand: python serve.py
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: GEO_DATA_DIR
        value: /tmp/emergencycore/geo
      - key: HF_HOME
        value: /tmp/emergencycore/huggingface
      - key: API_TOKEN
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_VISION_MODEL
        value: qwen/qwen3.8-27b
      - key: AI_FALLBACK_ENABLED
        value: 'false'
      - key: ALASKA_511_API_KEY
        sync: false
      - key: NWS_USER_AGENT
        sync: false
